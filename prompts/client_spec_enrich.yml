id: client_spec_enrich
title: KSSL product specifications - add the ones that are missing, each from a credible source document
version: 1
fills: [client_product_specification, client_product_source]
shows_on: Product Evaluation (the KSSL side of a comparison) and the KSSL product spec table
cadence: quarterly
recurring: false          # a product is written once per prompt version (re-run: bump the version or use --rerun)
handler: client_spec_enrich      # prompts/client_spec_enrich.py: it only ADDS spec rows that pass its checks; the Excel-verified specs are
                                 # never changed or deleted
# The KSSL twin of spec_enrich.yml (Product Evaluation flood, plan B, 2026-10-18).
#  - subject = a KSSL product that backend/harvest_specs.py stored documents for (triage.spec_products): kssl.in pages, KSSL press
#    releases and PDFs, the partner maker's page (Thales for the FZ rockets, Paramount for Mbada), listed trade press that names KSSL.
#  - WANTED = the specs the paired rival products state, so the same specs are looked for first.
#  - the handler re-reads the document, checks the sentence is in it and the value is in the sentence, that the source is credible, and
#    skips a spec the product already has (label, or the spec dictionary's canonical key). Whatever fails is not written.
# NOTE: backend/excel_load.py replaces ALL specs of a product it reloads; re-run this prompt (--rerun) after such a reload.
# A subject placeholder inside a documents query is bound as a SQL parameter, never pasted into the text.

subject:
  key: run_key            # routine (2026-10-18): product + a fingerprint of its documents -> re-runs exactly when new documents arrive
  query: |
    SELECT cp.client_product_id, cp.product_name, cp.category, count(DISTINCT d.doc_id) AS spec_documents,
           cp.client_product_id::text || ':' || left(md5(string_agg(DISTINCT d.doc_id::text, ',' ORDER BY d.doc_id::text)), 10) AS run_key,
           (SELECT count(*) FROM staging.client_product_specification s WHERE s.client_product_id = cp.client_product_id) AS stored_specs
    FROM staging.client_product cp
    JOIN staging.source_document d ON d.triage->'spec_products' ? cp.client_product_id::text AND d.mentions_client
    WHERE coalesce(d.body_text, '') <> ''
    GROUP BY cp.client_product_id, cp.product_name, cp.category
    ORDER BY cp.category, cp.product_name
  documents:
    - from: sql                  # the specs the product already has (do not repeat them)
      query: |
        SELECT 'STORED SPEC' AS doc, s.spec_name AS spec_label, s.value_text AS spec_value, s.unit
        FROM staging.client_product_specification s WHERE s.client_product_id = {{subject.client_product_id}} ORDER BY s.display_order
    - from: sql                  # the specs the paired rival products state: look for the same ones first (not a list to fill in)
      query: |
        SELECT DISTINCT 'WANTED' AS doc, s.spec_label
        FROM staging.competitive_matchup m JOIN staging.competitive_product_specification s ON s.product_id = m.competitor_product_id
        WHERE m.client_product_id = {{subject.client_product_id}} ORDER BY 2 LIMIT 40
    - from: sql                  # the documents harvested for this product, maker pages first
      cap: 72000
      query: |
        SELECT 'DOCUMENT' AS doc, d.published_at, d.title, d.source_name, d.url,
               substr(d.body_text, coalesce((d.triage->'spec_offset'->>({{subject.client_product_id}})::text)::int, 0) + 1, 12000) AS text
        FROM staging.source_document d
        WHERE d.triage->'spec_products' ? ({{subject.client_product_id}})::text AND d.mentions_client AND coalesce(d.body_text, '') <> ''
        ORDER BY (d.source_tier = 'primary') DESC, d.published_at DESC NULLS LAST LIMIT 6

context: [client]

task: |
  TASK client_spec_enrich — list the technical specifications of {{client.name}}'s {{subject.product_name}} (category {{subject.category}})
  that the DOCUMENTS state and that STORED SPEC does not have yet. WEB SEARCH is off. Use ONLY the DOCUMENT rows.

  A spec is a measurable or named technical property of THIS product: range, calibre, weight, length, rate of fire, crew, speed, payload,
  endurance, armour level, engine power, ammunition type, and so on. For a service product (maintenance, repair and overhaul) a spec is
  a stated scope: which platforms, which assemblies, which level of overhaul. NOT specs: prices, order quantities, delivery dates,
  customers, company facts, marketing adjectives, or a property of another product that the document mentions in passing.

  RULES
   1. Only this product. A page often lists several products one after another (a company's artillery page lists every gun). Use only
      the section whose heading or name matches {{subject.product_name}}. A figure whose product is not clear is left out. The same
      applies to variants: a figure for another calibre or another version is left out.
   2. Copy the value exactly as the document writes it ("30 km", "52 calibres", "Level 4"). Never convert, round, add or average.
   3. Condition in the label. If the document ties the figure to a condition (round type, loaded or empty, road or off-road, day or
      night, burst or sustained), put it in the label in brackets: "Maximum range (base-bleed round)". A figure with no stated condition has
      a plain label.
   4. Do not repeat a spec that STORED SPEC already has, under the same or a similar label, even if the document gives another figure.
   5. Every spec needs the document's URL (one of the DOCUMENT urls) and the exact sentence or table line that states it (verbatim, at
      most 300 characters, copied character for character). The value must be written in that sentence.
   6. At most 12 specs. Look first for the specs in WANTED (what the competing products state), then the most useful others.
      None found: "records": [] and "skip_reason".

  Per spec, one record, table client_product_specification:
   - spec_label: max 150 characters, short English name, with the condition in brackets when rule 3 applies
   - spec_value: as written in the document
   - unit: the unit as written ("km", "kg", "mm", "rounds/min"); empty when the value carries none
   - source_url: the DOCUMENT url
   - quote: the verbatim sentence

  DOCUMENTS (stored specs, the WANTED spec names, then the documents about the product; a document may start mid-page):
  {{documents}}

output:
  client_product_specification:       # documentary only (handler)
    card: true
    key: [prompt_id, subject]
    columns:
      spec_label: {required: true, max: 150}
      spec_value: {required: true}
      unit: {max: 40}
