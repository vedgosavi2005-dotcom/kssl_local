id: top_opportunity
title: Weekly top opportunities (text for the code-ranked top tenders and projects before tender)
version: 3
fills: [market_top_opportunity_tender, market_top_opportunity_project, market_next_move, market_top_opportunity_metric]
shows_on: Top opportunity page (tiles, Top tenders, Projects to win before they tender, Next moves)
cadence: weekly
# v3 (prompt rebuild, step 5; docs/audit_v2/PROMPT_LOGIC_FABLE_REVIEW.md A.2.1, F.2): the ORDER is decided by code, the TEXT by this prompt.
#  - Code ranks (backend/market_rollups.py top_candidates: strong before partial, then pursue label, attractiveness, ability, fit score, soonest
#    closing; projects: fit, then newest). The ranked rows are the documents below.
#  - The model writes only `decides` (tenders) and `rival_to_beat` / `where_it_stands` (projects), copying stored values. Then the hook
#    derive.top_opportunity_finalize (code) validates: it keeps the model's text for rows the code ranked, drops any row the code did not rank, adds a
#    code default for a row the model missed, and sets rank_position, kssl_fit, kssl_model, status and revenue_text from the stored rows. The prompt can
#    not change the order or a grade.
#  - Next moves (market_next_move: kind, action text, due date AND due_text from the tender's own dates and eligibility rows) and the four metric
#    tiles (market_top_opportunity_metric) are written by code in the same hook. The prompt does not write them.
# Run it after every tender_assessment batch (one cheap run over all stored rows): python -m prompts.run top_opportunity --rerun
# No web search: every fact comes from the stored rows.

subject:
  key: week_start
  query: |
    SELECT date_trunc('week', current_date)::date AS week_start, current_date AS run_date
  documents:
    - from: sql
      query: |
        SELECT 'TOP TENDER' AS doc, row_number() OVER (ORDER BY CASE a.fit_grade WHEN 'strong' THEN 0 ELSE 1 END,
                 CASE a.pursue_label WHEN 'pursue' THEN 0 WHEN 'position' THEN 1 WHEN 'monitor' THEN 2 ELSE 3 END, a.attractiveness DESC NULLS LAST,
                 a.ability DESC NULLS LAST, a.fit_score DESC NULLS LAST, t.closing_date NULLS LAST, t.tender_id) AS rank,
               t.notice_reference, t.title, t.buyer_name, t.country_name, t.closing_date, t.value_text, a.fit_grade, a.pursue_label, a.time_to_award, t.kssl_model,
               (SELECT string_agg(e.item || ' = ' || e.state || coalesce(' (fixable ' || e.fixable || ')', ''), '; ' ORDER BY e.display_order)
                  FROM staging.market_tender_eligibility e WHERE e.tender_id = t.tender_id) AS eligibility,
               (SELECT f.competitor_name || ' ' || coalesce(f.competitor_product_display, '') FROM staging.market_tender_competitor_fit f
                 WHERE f.tender_id = t.tender_id ORDER BY f.rank_position NULLS LAST LIMIT 1) AS top_rival
        FROM staging.market_tender t
        JOIN (SELECT DISTINCT ON (tender_id) * FROM staging.market_tender_fit_assessment ORDER BY tender_id, assessed_at DESC) a ON a.tender_id = t.tender_id
        WHERE t.status IN ('open', 'closing') AND (t.closing_date IS NULL OR t.closing_date >= current_date) AND a.fit_grade IN ('strong', 'partial')
        ORDER BY rank LIMIT 15
    - from: sql
      query: |
        SELECT 'TOP PROJECT' AS doc, row_number() OVER (ORDER BY CASE f.fit_grade WHEN 'strong' THEN 0 ELSE 1 END, o.as_of_date DESC NULLS LAST, o.opportunity_id) AS rank,
               o.title, o.buyer_name, o.stage, o.current_status, o.latest_milestone, o.as_of_date, f.fit_grade, f.client_model_display AS kssl_model,
               f.rival_name, f.rival_product_display
        FROM staging.market_opportunity o
        JOIN (SELECT DISTINCT ON (opportunity_id) * FROM staging.market_opportunity_fit_assessment ORDER BY opportunity_id, assessed_at DESC) f ON f.opportunity_id = o.opportunity_id
        WHERE f.fit_grade IN ('strong', 'partial') AND coalesce(o.stage, '') NOT IN ('cancelled', 'delivered')
        ORDER BY rank LIMIT 10

context: [client]

task: |
  TASK top_opportunity - for each TOP TENDER and TOP PROJECT row below (already ranked by code; do not reorder, add or drop any), write the short text the
  Top opportunity page shows. Run date: {{subject.run_date}}. Use ONLY the rows. WEB SEARCH is off. Copy names and values exactly as given.

  TOP TENDERS - table market_top_opportunity_tender, one record per TOP TENDER row, in the same order:
   - ref_tender: the row's notice_reference, exactly as given
   - decides: JUDGEMENT. One plain sentence, max 160 characters: when the bid closes ("Closes 30 Oct 2026"), then the one condition that decides
     whether KSSL can bid, taken from the row's eligibility list (a not_met item first, else an unknown one); only the closing date when the list is empty.
     Never invent a condition. _reason: one sentence naming the row field it rests on
   - rival_to_beat: the row's top_rival exactly as given; null if none
  TOP PROJECTS - table market_top_opportunity_project, one record per TOP PROJECT row, in the same order:
   - ref_opportunity: the row's title, exactly as given
   - where_it_stands: JUDGEMENT. One plain sentence, max 160 characters, from the row's stage, current_status, latest_milestone and as_of_date ("Budget approved on 7 Sep 2026; tender not yet issued")
   - rival_to_beat: the row's rival_name and rival_product_display joined; null if none
  Do not write fit, model, rank, revenue or next moves: code sets them.

  PLAIN ENGLISH. Sentences of 20 words or fewer, one idea each, no hype, no advice ("should").

  EXAMPLE of the shape only (fictional): {"prompt_id": "top_opportunity", "subject": "week", "skip_reason": null, "records": [
   {"table": "market_top_opportunity_tender", "values": {"ref_tender": "123456-2026", "decides": "Closes 30 Oct 2026; local content 30 percent decides whether KSSL can bid.",
     "rival_to_beat": "Nordvik Defence NV-155", "_reason": {"decides": "closing_date 2026-10-30 and the eligibility item local content = not_met."}}},
   {"table": "market_top_opportunity_project", "values": {"ref_opportunity": "Veland army plans 36 mounted guns", "where_it_stands": "Budget approved on 12 Sep 2026; tender expected next year.",
     "rival_to_beat": "Nordvik Defence NV-155", "_reason": {"where_it_stands": "stage approved_funded and latest_milestone Budget approved."}}}], "not_found": [], "conflicts": []}

  CLIENT: {{context.client}}

  DOCUMENTS (the ranked rows):
  {{documents}}

output:
  market_top_opportunity_tender:
    card: true
    replace: all_rows            # the hook rewrites rank / fit / model / status from the stored rows after this load
    key: [prompt_id, subject, rank]
    refs: {ref_tender: market_tender.notice_reference}
    columns:
      tender_id: {required: true, from_ref: ref_tender}
      rival_to_beat: {max: 240}
      decides: {judgement: true, max: 160, plain: warn}
    loader:
      top_opportunity_tender_id: new_id
      rank_position: index_plus_1_of_output_order
      status: copy_of_tender_status
  market_top_opportunity_project:
    card: true
    replace: all_rows
    key: [prompt_id, subject, rank]
    refs: {ref_opportunity: market_opportunity.title}
    columns:
      opportunity_id: {required: true, from_ref: ref_opportunity}
      rival_to_beat: {max: 240}
      where_it_stands: {judgement: true, max: 160, plain: warn}
    loader:
      top_opportunity_project_id: new_id
      rank_position: index_plus_1_of_output_order

derive: [top_opportunity_finalize]
