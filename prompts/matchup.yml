id: matchup
title: Product matchup verdict (words only, for the top pairs; the numbers are computed by code)
version: 4
fills: [competitive_matchup, competitive_matchup_advantage]
shows_on: Product Evaluation (matchup list, dossier verdict, advantage lists). Pairs with nothing comparable are hidden.
cadence: quarterly
recurring: false          # a pair / product is written once per prompt version (re-run: bump the version or use --rerun)
handler: matchup_verdict         # the answer is applied by prompts/matchup_verdict.py: it writes verdict text and advantage lines onto the existing
                                 # code matchup; it never writes or changes a number, a spec row, a gap, an edge score or a decision level
# v2 (prompt rebuild, docs/audit_v2/PROMPT_LOGIC_FABLE_REVIEW.md A.1.5, C "matchup.yml"; user brief section 3):
#  - the pair already passed the like-for-like gate (same category, sub-type, calibre, weight class: prompts/matchup_class.py) and the code
#    engine (prompts/matchup_code.py) has compared every spec both sides give, with units, gap and better side. The model writes TEXT only.
#  - the model reads the stored comparison rows AND the full text specs of both products, and may use a text spec the code could not
#    compare (a calibre written in words, a feature list) -- but only when both sides state it for the SAME condition.
#  - the same ammunition condition only: a range with a base-bleed round is not compared with a range with a plain round.
#  - nothing comparable -> nothing is written, the pair stays hidden (comparable_spec_count 0 and no verdict).
#  - subjects = the top pairs the code engine proposed (the rule of prompts/matchup_code.py report(): rank inside a client product by
#    comparable specs, then specs both sides give, then distance from parity; at most 5 per client product; first 90 overall).
# v3 (kssl-40, 2026-10-18): the model also gives decision_level (1 behind / 2 near parity / 3 ahead) from the same judgement as the
#  verdict words; the UI's AHEAD / NEAR PARITY / BEHIND badge reads only that column (no score threshold).
# v4 (user 2026-10-18, the dossier ANALYTICS panel "should be given by prompt only"): advantage rows get a kind -- compared (a lead
#  on a compared spec, both figures: the ▲ list) or stated (a capability one side's own rows state, never a claim about the other side:
#  the ◆ list), so a level pair still shows what each product offers.
# Routine (2026-10-18): the key is matchup_id + a fingerprint of the compared rows, so a scheduled run writes the words again exactly when
#  prompts/matchup_code.py's comparison of the pair changed (it clears a verdict whose rows changed), and never otherwise.
# A subject placeholder inside a documents query is bound as a SQL parameter, never pasted into the text.

subject:
  key: run_key
  query: |
    WITH base AS (
      SELECT m.*, (SELECT count(*) FROM staging.competitive_matchup_specification s WHERE s.matchup_id = m.matchup_id
                    AND s.comparability_state IN ('comparable', 'not_comparable')) AS both_sided,
             CASE WHEN m.edge_score IS NULL THEN -1 ELSE abs(m.edge_score - 50) END AS dist
      FROM staging.competitive_matchup m WHERE position('(code comparison)' in m.match_basis) > 0
    ), ranked AS (
      SELECT b.*, row_number() OVER (PARTITION BY b.client_product_id
                 ORDER BY coalesce(b.comparable_spec_count, 0) DESC, b.both_sided DESC, b.dist DESC, coalesce(b.sourced_spec_count, 0) DESC,
                          b.competitor_name, b.competitor_product_name) AS rk
      FROM base b
    )
    SELECT r.matchup_id, r.client_product_id, r.client_product_name AS client_product, r.competitor_id, r.competitor_name AS competitor,
           r.competitor_product_id, r.competitor_product_name AS competitor_product, r.category_code AS category, r.match_basis,
           r.comparable_spec_count, r.rk,
           r.matchup_id::text || ':' || left(md5(coalesce((SELECT string_agg(concat_ws('|', s.spec_label, s.client_value_text, s.competitor_value_text,
                     s.comparability_state, s.better_side), ';' ORDER BY s.display_order, s.spec_label)
             FROM staging.competitive_matchup_specification s WHERE s.matchup_id = r.matchup_id), '')), 10) AS run_key
    FROM ranked r
    WHERE r.both_sided >= 1 AND r.rk <= 5
    ORDER BY r.rk, coalesce(r.comparable_spec_count, 0) DESC, r.both_sided DESC, r.dist DESC, coalesce(r.sourced_spec_count, 0) DESC,
             r.competitor_name, r.competitor_product_name
    LIMIT 90
  documents:
    - from: sql                  # what the code compared (the numbers are final; the words are yours)
      query: |
        SELECT 'COMPARED' AS doc, s.spec_label, s.client_value_text, s.client_value_numeric, s.competitor_value_text, s.competitor_value_numeric,
               s.unit, s.comparability_state, s.better_side, s.gap_value
        FROM staging.competitive_matchup_specification s
        WHERE s.matchup_id = {{subject.matchup_id}}
        ORDER BY s.display_order
    - from: sql                  # every stored spec of the KSSL product
      query: |
        SELECT 'KSSL SPEC' AS doc, s.spec_group, s.spec_name, s.value_text, s.value_numeric, s.unit, src.source_url
        FROM staging.client_product_specification s
        LEFT JOIN staging.client_product_source src ON src.source_id = s.source_id AND src.client_product_id = s.client_product_id
        WHERE s.client_product_id = {{subject.client_product_id}}
        ORDER BY s.display_order
    - from: sql                  # every stored spec of the competitor product
      query: |
        SELECT 'RIVAL SPEC' AS doc, s.spec_label, s.spec_value, s.unit, s.source_url
        FROM staging.competitive_product_specification s
        WHERE s.product_id = '{{subject.competitor_product_id}}'
        ORDER BY s.spec_label

context: [client]

task: |
  TASK matchup — write the words for one like-for-like pair: {{client.name}}'s {{subject.client_product}} against
  {{subject.competitor}}'s {{subject.competitor_product}} (category {{subject.category}}). The pair already passed the
  like-for-like test ({{subject.match_basis}}). WEB SEARCH is off. Use ONLY the COMPARED, KSSL SPEC and RIVAL SPEC rows below. Never add a
  figure from general knowledge. You write text only: do not output a number that is not in the rows, and never change a value, unit,
  gap, score or level. The code has already decided better side and gap in the COMPARED rows; report them as they are.

  RULES OF COMPARISON
   1. Same condition only. Two values are compared only if both rows state the same thing in the same unit under the same condition:
      the same ammunition or round type (a plain round, a base-bleed round, a rocket-assisted round and a guided round are four
      different conditions), loaded or empty, day or night, road or off-road, burst or sustained, towed or self-propelled, with or
      without an option. If a row names no condition, say so and treat it as unconditioned: compare it only with another
      unconditioned row.
   2. A text spec (for example a calibre or a feature written in words) may be compared when both sides state it and it means the same
      thing. Say which rows you used. If the two cartridges or rounds have different names (5.56 x 30 vs 5.56 x 45), say so: the bore is
      the same but the rounds are not.
   3. If one side does not state a spec, say "the sources do not give <spec> for <product>". Do not guess it.
   4. If nothing can be compared under rules 1 and 2, set "nothing_comparable": true and write no verdict and no advantages.

  One record, table competitive_matchup (exactly one):
   - nothing_comparable: true or false
   - decision_level: JUDGEMENT. 3 = {{client.name}}'s product is ahead overall on the compared specs, 2 = near parity (level, or
     each side leads on something, or no lead on any compared spec), 1 = behind. It must say the same as the headline and the verdict.
   - verdict_headline: JUDGEMENT. Max 80 characters: who leads and on what, plainly ("KSSL reaches farther; the rival is lighter")
   - verdict: JUDGEMENT. 2-4 plain sentences of 25 words or fewer each (split a long one in two). Which side leads on which compared specs, with the figures of both sides. Then what cannot
     be compared and why (a missing value, a different condition). Then one sentence on what a buyer of this kind of product weighs
     most, from the rows only. No adjectives such as "superior", no counts, no recommendation, never "{{client.name}} should".
   children:
   competitive_matchup_advantage (JUDGEMENT), two kinds per side:
   - side: client or competitor
   - kind: compared or stated
   - advantage_text: one plain sentence, max 200 characters.
     compared (0-4 per side): a lead on a COMPARED row, with the figures of both sides and the condition ("Longer range with a plain
       round: 41 km vs 38 km"). Only where the code or rules 1-2 give that side the lead.
     stated (1-4 per side whose rows state any capability): a capability or feature that side's OWN spec rows state, with its figure or
       name ("Self-propelled mode up to 21 km/h"; "Automatic ammunition load-assist system"). Take it from KSSL SPEC rows for client and
       RIVAL SPEC rows for competitor. Never say or imply that the other side lacks it, and never repeat a compared line. Leave out
       source notes in brackets ("(KSSL page)", "(Army Recognition 2021)").
  For every JUDGEMENT field give "_reason": one sentence naming the rows it rests on. For the verdict give "_sources": the rows used, as
  {"url": <the row's source_url or null>, "quote": "<spec label>: <value> <unit>" exactly as in the row}.

  PLAIN ENGLISH. Managers who are not weapons specialists read this. Sentences of 20 words or fewer, active voice, one idea each. A
  technical term only when it is the name of the thing. Never use: leverage, synergy, ecosystem, robust, cutting-edge, state-of-the-art,
  game-changer, going forward, end-to-end.

  CLIENT: {{context.client}}

  DOCUMENTS (the compared rows, then every stored spec of both products):
  {{documents}}

output:
  competitive_matchup:        # documentary only (handler)
    card: true
    key: [prompt_id, subject]
    columns:
      decision_level: {judgement: true, enum: [1, 2, 3]}
      verdict_headline: {judgement: true, max: 80}
      verdict: {judgement: true}
    children:
      competitive_matchup_advantage:
        columns: [side, kind, advantage_text]
        required: [side, advantage_text]
        judgement: [advantage_text]
        enum: {side: [client, competitor], kind: [compared, stated]}
        max: {advantage_text: 200}
