id: moment
title: Competitor moment (graded moves by one competitor, last 90 days)
version: 2
fills: [competitive_competitor_moment, competitive_competitor_moment_analysis, competitive_competitor_moment_source]
shows_on: Competitor Moment page (move list, drawer facts, "Analysis - what it means", "Deeper analysis - by view", source link)
cadence: weekly                  # one run per competitor; the runner re-runs a subject when its cadence period has passed
# web_search: inherits false. Documents = the competitor's news rows of the last 90 days (headlines) PLUS
# the fetched text of its 5 newest articles. Fetch is on because a headline alone cannot support
# what_happened or kssl_analysis without inference. Null url_N values are skipped by the runner.
# A subject placeholder inside a documents query is bound as a SQL parameter, never pasted into the text.

subject:
  key: competitor_id
  query: |
    SELECT c.competitor_id, c.display_name, c.short_name, c.origin_country,
           u.urls[1] AS url_1, u.urls[2] AS url_2, u.urls[3] AS url_3, u.urls[4] AS url_4, u.urls[5] AS url_5
    FROM staging.competitive_competitor c
    CROSS JOIN LATERAL (
      SELECT array_agg(a.article_url ORDER BY a.published_date DESC) AS urls
      FROM (SELECT n.article_url, n.published_date
            FROM staging.competitive_news_article n
            WHERE n.competitor_id = c.competitor_id AND n.article_url IS NOT NULL
              AND n.published_date >= current_date - 90
            ORDER BY n.published_date DESC LIMIT 5) a
    ) u
    WHERE u.urls IS NOT NULL
    ORDER BY c.display_name
  documents:
    - from: sql
      query: |
        SELECT n.published_date, n.headline, n.publisher, n.article_url
        FROM staging.competitive_news_article n
        WHERE n.competitor_id = '{{subject.competitor_id}}' AND n.published_date >= current_date - 90
        ORDER BY n.published_date DESC LIMIT 60
    - {from: url, field: url_1}
    - {from: url, field: url_2}
    - {from: url, field: url_3}
    - {from: url, field: url_4}
    - {from: url, field: url_5}

context: [client, client_products, competitors, categories, moment_levels]

task: |
  TASK moment — list the moves {{subject.display_name}} made in the last 90 days, grade each for
  {{client.name}}, and fill one moment card per move.

  A MOVE is a concrete event the documents report about {{subject.display_name}}: contract, order,
  selection, delivery, trial, product launch, partnership or joint venture, acquisition, new
  facility or capacity, export approval, leadership change, financial result. Opinion, forecasts
  and market commentary are not moves. One event reported by several articles is ONE move (the
  other articles become its sources). RELEVANCE: keep a move only if it falls in one of the
  CATEGORIES below (the client's lines of business); a move in an unrelated business of the
  company (civil construction, chemicals, energy, IT...) is not a move here, and a company-wide
  event (leadership change, financial result) counts only when the source ties it to those
  categories. Skip moves older than 90 days. At most 10 moves, newest
  first. No move found: "records": [] and "skip_reason" = one sentence.

  For each move, one record, table competitive_competitor_moment:
   - title: the move as a headline, max 120 characters, in the article's words
   - card_summary: one sentence, max 160 characters, what happened (stated facts only)
   - description: 1-2 sentences, max 300 characters, what happened (stated facts only)
   - what_happened: 2-4 sentences: who, what, where, quantities, values, dates, as stated
   - kssl_analysis: JUDGEMENT. 1-3 sentences: what the move means for {{client.name}}, naming the
     {{client.name}} product(s) from CLIENT PRODUCTS it touches, or saying none is touched
   - movement_date: the date the move happened as the source states it; else the article date
     (say so in _precision)
   - ref_category: one name from CATEGORIES, exactly as written; null if none fits
   - country_name: the country where the move happens, English short name; null if none is stated
   - countries: all countries involved, comma-separated; null when only country_name applies
   - region: a region or group exactly as the source states it (e.g. a bloc or region name);
     null if none is stated
   - program_name: the programme the source names for this move; null if none
   - grade: JUDGEMENT. One level_code from LEVELS (left of the "="). Choose by the level label:
     the level meaning the move strengthens the competitor against {{client.name}} in a category
     where {{client.name}} has a product; the level meaning it is relevant but indirect; the level
     meaning it weakens the competitor or opens ground for {{client.name}}. No level fits: null.
   - source_url: the most informative article; source_label: its publisher
   children:
   competitive_competitor_moment_analysis (0-3 rows, only where the documents support a view):
   - view_name: the dashboard area the analysis speaks to; one of: Products, Product Evaluation,
     Partnerships, Projects, Geo Footprint, Patents
   - analysis_text: JUDGEMENT. 1-3 sentences, stated facts plus what they imply for {{client.name}}
   competitive_competitor_moment_source (1-3 rows, one per article that reports the move):
   - publisher, source_type (company = the competitor's own site; official = government, ministry,
     armed forces; news = editorial outlet or trade press), source_url

  CLIENT: {{context.client}}
  CLIENT PRODUCTS:
  {{context.client_products}}
  COMPETITORS:
  {{context.competitors}}
  CATEGORIES:
  {{context.categories}}
  LEVELS:
  {{context.moment_levels}}

  DOCUMENTS (news rows of {{subject.display_name}}, then the text of its newest articles):
  {{documents}}

output:
  competitive_competitor_moment:
    card: true
    key: [prompt_id, subject, source_url]     # same article -> same moment id; other moments are left alone
    columns:
      title: {required: true, max: 120}
      card_summary: {max: 160}
      description: {max: 300}
      what_happened: {required: true}
      kssl_analysis: {judgement: true}
      movement_date: {type: date, required: true}
      category: {from_ref: ref_category}
      country_name: {max: 160}
      countries: {}
      region: {max: 128}
      program_name: {max: 240}
      grade: {judgement: true, enum_from: context.moment_levels}   # level_code values only
      source_url: {required: true}
      source_label: {max: 240}
    loader:
      moment_id: new_id
      competitor_id: subject.competitor_id
      company_display: subject.display_name
      source_domain: host_of_source_url
      display_order: rank_by_movement_date_desc
    children:
      competitive_competitor_moment_analysis:
        columns: [view_name, analysis_text]
        required: [view_name, analysis_text]
        judgement: [analysis_text]
        enum: {view_name: [Products, Product Evaluation, Partnerships, Projects, Geo Footprint, Patents]}
        loader: {analysis_id: new_id, moment_id: parent_id, display_order: index}
      competitive_competitor_moment_source:
        columns: [publisher, source_type, source_url]
        required: [source_url]
        enum: {source_type: [company, official, news]}
        loader: {source_id: new_id, moment_id: parent_id, source_domain: host_of_source_url}
