id: moment
title: Competitor moment (the dated moves of one competitor, as a timeline)
version: 3
fills: [competitive_competitor_moment, competitive_competitor_moment_analysis, competitive_competitor_moment_source]
shows_on: Competitor Moment page (move list as a timeline, drawer facts, "Analysis - what it means", "Deeper analysis - by view", source link)
cadence: weekly                  # one run per competitor; the runner re-runs a subject when its cadence period has passed
# v3 (prompt rebuild, docs/audit_v2/PROMPT_LOGIC_FABLE_REVIEW.md A.1.3, C "moment.yml (v3)"; user brief section 7):
#  - a moment is a roll-up, not a second reading of the news: the documents are the competitor's STORED SIGNALS (with the steps of their
#    story) of the last 120 days, then the best-scored harvested documents of the raw layer for moves no signal covers yet. Nothing is fetched.
#  - the grade is set by code from the label of the signal the moment points at (derive.moment_grade: threat -> high, watch -> watch,
#    fav -> opportunity). A move with no signal gets the grade the model judges (with a reason).
#  - change_note = what changed since the previous move of this competitor (the timeline rail).
#  - "deeper analysis by view" only for views that have stored rows for this competitor (VIEWS WITH ROWS).
# A subject placeholder inside a documents query is bound as a SQL parameter, never pasted into the text.

subject:
  key: competitor_id
  query: |
    SELECT c.competitor_id, c.display_name, c.short_name, c.origin_country
    FROM staging.competitive_competitor c
    WHERE EXISTS (SELECT 1 FROM staging.competitive_signal s WHERE s.company_id = c.competitor_id AND s.event_date >= current_date - 120)
       OR EXISTS (SELECT 1 FROM staging.source_document d
                   WHERE c.competitor_id = ANY(d.competitor_ids) AND coalesce(d.published_at, current_date) >= current_date - 120
                     AND coalesce(d.body_text, '') <> ''
                     AND (coalesce((d.triage->'info'->>'deal')::numeric, 0) >= 0.6 OR coalesce((d.triage->'info'->>'sales_geo')::numeric, 0) >= 0.6
                          OR d.triage->'route' ? 'moment'))
    ORDER BY (SELECT count(*) FROM staging.competitive_signal s WHERE s.company_id = c.competitor_id AND s.event_date >= current_date - 120) DESC,
             c.display_name
  documents:
    - from: sql                  # 1. the competitor's stored signals and the steps of their stories
      query: |
        SELECT 'SIGNAL' AS doc, s.title AS signal_title, s.event_date, s.classification AS label, s.probability, s.impact, s.impact_dimension,
               d.glance_move, d.glance_where, d.glance_third_party, left(d.what_article_says, 450) AS what_it_says, d.source_url,
               (SELECT string_agg(t.step_date::text || ' ' || t.step_type || ': ' || coalesce(t.one_line, ''), ' ; ' ORDER BY t.step_no)
                  FROM staging.story_step t WHERE t.story_id = s.story_id) AS story_steps
        FROM staging.competitive_signal s
        JOIN staging.competitive_signal_detail d ON d.signal_id = s.signal_id
        WHERE s.company_id = '{{subject.competitor_id}}' AND s.event_date >= current_date - 120
        ORDER BY s.event_date DESC, s.title LIMIT 25
    - from: sql                  # 2. best-scored harvested documents (deal / sales scores of the triage, or routed to moment)
      query: |
        SELECT 'DOCUMENT' AS doc, d.published_at, d.title, d.source_name, d.url,
               round(greatest(coalesce((d.triage->'info'->>'deal')::numeric, 0), coalesce((d.triage->'info'->>'sales_geo')::numeric, 0)), 2) AS score,
               left(d.body_text, 1800) AS text
        FROM staging.source_document d
        WHERE '{{subject.competitor_id}}'::uuid = ANY(d.competitor_ids) AND coalesce(d.published_at, current_date) >= current_date - 120
          AND coalesce(d.body_text, '') <> ''
        ORDER BY (CASE WHEN d.triage->'route' ? 'moment' THEN 1 ELSE 0 END) DESC,
                 greatest(coalesce((d.triage->'info'->>'deal')::numeric, 0), coalesce((d.triage->'info'->>'sales_geo')::numeric, 0)) DESC,
                 d.published_at DESC NULLS LAST LIMIT 9
    - from: sql                  # 3. which views have stored rows for this competitor
      query: |
        SELECT 'VIEWS WITH ROWS' AS doc,
               concat_ws(', ',
                 CASE WHEN EXISTS (SELECT 1 FROM staging.competitive_product p WHERE p.competitor_id = '{{subject.competitor_id}}') THEN 'Products' END,
                 CASE WHEN EXISTS (SELECT 1 FROM staging.competitive_matchup m WHERE m.competitor_id = '{{subject.competitor_id}}') THEN 'Product Evaluation' END,
                 CASE WHEN EXISTS (SELECT 1 FROM staging.competitive_partnership p WHERE p.competitor_id = '{{subject.competitor_id}}') THEN 'Partnerships' END,
                 CASE WHEN EXISTS (SELECT 1 FROM staging.competitive_project p WHERE p.competitor_id = '{{subject.competitor_id}}') THEN 'Projects' END,
                 CASE WHEN EXISTS (SELECT 1 FROM staging.competitive_geo_company_presence p WHERE p.competitor_id = '{{subject.competitor_id}}') THEN 'Geo Footprint' END,
                 CASE WHEN EXISTS (SELECT 1 FROM staging.competitive_patent_portfolio p WHERE p.competitor_id = '{{subject.competitor_id}}') THEN 'Patents' END) AS views

context: [client, client_portfolio, client_markets, client_partners, categories, moment_levels]

task: |
  TASK moment — list the moves {{subject.display_name}} made in the last 120 days, in date order, and fill one moment card per
  move. The page shows them as a timeline: each card says what happened, what it means for {{client.name}}, and what changed
  since the competitor's previous move. Every judgement is made from {{client.name}}'s point of view, using only the blocks at the
  end of this task for facts about {{client.name}}.

  A MOVE is a concrete event: contract, order, selection, delivery, trial, product launch, partnership or joint venture,
  acquisition, new facility or capacity, export approval, a cancellation or failure, a procurement step. Opinion, forecasts and
  market commentary are not moves. One event reported by several documents is ONE move (the other documents become its sources).
  KEEP a move only if it falls in one of the CATEGORIES below, or touches something in CLIENT PORTFOLIO, CLIENT MARKETS or
  CLIENT PARTNERS. A move in an unrelated business of the company (civil construction, chemicals, energy, IT) is not a move here.
  Skip moves older than 120 days. At most 12 moves, newest first. No move found: "records": [] and "skip_reason" = one sentence.

  SOURCES OF MOVES, in this order:
   1. Each SIGNAL row is already a judged move. Make one moment of it. Copy its title exactly into ref_signal. Do not re-score it;
      the grade comes from its label by code. Use its story steps for change_note.
   2. A DOCUMENT row that reports a move no SIGNAL covers is a move too. Leave ref_signal empty and give the grade yourself.
  Two SIGNAL rows of one story are two steps of one thread: make two moments only if both are dated moves.

  Per move, one record, table competitive_competitor_moment:
   - ref_signal: the SIGNAL row's signal_title, written exactly; empty when no signal covers the move
   - title: the move as a headline, at most 110 characters (count them; longer is rejected), with the full company and product names
   - card_summary: one sentence, max 160 characters, what happened (stated facts only)
   - description: 1-2 sentences, max 300 characters, what happened (stated facts only)
   - what_happened: 2-4 plain sentences: who, what, where, quantities, values, dates, as stated
   - kssl_analysis: JUDGEMENT. 1-3 plain sentences: what the move means for {{client.name}}. Name the {{client.name}} product from
     CLIENT PORTFOLIO, the market from CLIENT MARKETS or the partner from CLIENT PARTNERS that it touches, and say how. If none is
     touched, write exactly: "No <product> product line is touched; kept because <reason>." where <reason> names why it still matters.
     Never write "{{client.name}} should".
   - change_note: JUDGEMENT. One sentence, max 160 characters: what changed since this competitor's previous move on the list
     (a new customer, a step from trial to order, a value, a new country). For the oldest move on the list: "First move on this list."
   - movement_date: the date the move happened as the source states it (a SIGNAL row: its event_date); else the document date
     (say so in _precision)
   - ref_category: one name from CATEGORIES, exactly as written; null if none fits
   - country_name: the country where the move happens, English short name; null if none is stated
   - countries: all countries involved, comma-separated; null when only country_name applies
   - region: a region or group exactly as the source states it; null if none is stated
   - program_name: the programme the source names for this move; null if none
   - grade: JUDGEMENT, only when ref_signal is empty. One level_code from LEVELS (left of the "="): the level meaning the move
     strengthens the competitor against {{client.name}} where {{client.name}} has a product AND in a market of {{client.name}};
     the level meaning it is relevant but indirect; the level meaning it weakens the competitor or opens ground for {{client.name}}.
     With ref_signal given, leave grade empty.
   - source_url: the most informative document URL (a SIGNAL row: its source_url); source_label: its publisher
   children:
   competitive_competitor_moment_analysis (0-3 rows, only for a view named in VIEWS WITH ROWS):
   - view_name: one of the views listed in VIEWS WITH ROWS, exactly as written; if the list is empty, write no row
   - analysis_text: JUDGEMENT. 1-3 plain sentences, stated facts plus what they imply for {{client.name}}
   competitive_competitor_moment_source (1-3 rows, one per document that reports the move):
   - publisher, source_type (company = the competitor's own site; official = government, ministry, armed forces; news = editorial
     outlet or trade press), source_url

  REASONS AND SOURCES. For every JUDGEMENT field (kssl_analysis, change_note, grade, each analysis_text) give "_reason": one sentence
  naming the facts it rests on. For title, movement_date and what_happened give "_sources": the verbatim sentence and its URL.

  PLAIN ENGLISH. Managers who are not weapons specialists read this. Sentences of 20 words or fewer, active voice, one idea each.
  A technical term only when it is the name of the thing, explained in a few words the first time. Never use: leverage, synergy,
  ecosystem, robust, cutting-edge, state-of-the-art, game-changer, going forward, end-to-end, strengthens its position, extends its
  footprint, poses a threat to, positions itself, unprecedented. Say what IS touched, not what is absent. Never write the names of
  the blocks (CLIENT MARKETS...) in the text; say "KSSL's markets" or "KSSL's range".
  Example of the register (fictional): "Nordvik will build NV-155 guns in Veland with a local firm. The article gives no start date."

  CLIENT: {{context.client}}
  CLIENT PORTFOLIO ("category > sub_type: product (calibre; weight class; key specs)"):
  {{context.client_portfolio}}
  CLIENT MARKETS (countries where {{client.name}} sells, makes, has offered, or has a partner or customer):
  {{context.client_markets}}
  CLIENT PARTNERS (partner - type - what it supplies or does with {{client.name}}):
  {{context.client_partners}}
  CATEGORIES:
  {{context.categories}}
  LEVELS:
  {{context.moment_levels}}

  DOCUMENTS (the competitor's stored signals, then harvested documents, then the views with stored rows):
  {{documents}}

output:
  competitive_competitor_moment:
    card: true
    key: [prompt_id, subject, source_url]     # same document -> same moment id; other moments are left alone
    columns:
      title: {required: true, max: 120, plain: warn}
      card_summary: {max: 160, plain: warn}
      description: {max: 300, plain: warn}
      what_happened: {required: true, plain: strict}
      kssl_analysis: {judgement: true, plain: strict}
      change_note: {judgement: true, max: 160, plain: warn}
      movement_date: {type: date, required: true}
      category: {from_ref: ref_category}
      country_name: {max: 160}
      countries: {}
      region: {max: 128}
      program_name: {max: 240}
      signal_id: {from_ref: ref_signal}
      grade: {judgement: true, enum_from: context.moment_levels}   # level_code values only; code overrides it when a signal is given
      source_url: {required: true}
      source_label: {max: 240}
    loader:
      moment_id: new_id
      competitor_id: subject.competitor_id
      company_display: subject.display_name
      source_domain: host_of_source_url
      story_id: resolved_ref_signal_story_id
      display_order: rank_by_movement_date_desc
    children:
      competitive_competitor_moment_analysis:
        columns: [view_name, analysis_text]
        required: [view_name, analysis_text]
        judgement: [analysis_text]
        plain: {analysis_text: warn}
        enum: {view_name: [Products, Product Evaluation, Partnerships, Projects, Geo Footprint, Patents]}
        loader: {analysis_id: new_id, moment_id: parent_id, display_order: index}
      competitive_competitor_moment_source:
        columns: [publisher, source_type, source_url]
        required: [source_url]
        enum: {source_type: [company, official, news]}
        loader: {source_id: new_id, moment_id: parent_id, source_domain: host_of_source_url}

derive:
  - moment_grade               # grade from the label of the signal the moment points at
