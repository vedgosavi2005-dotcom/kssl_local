id: innovation_discovery
title: Innovation discovery (candidate innovations per technology category)
version: 1
fills: [technology_innovation, technology_innovation_source, technology_source]
shows_on: Innovation Pipeline (the list row; the detail panel is filled by innovation_detail)
cadence: quarterly
web_search: true
# STAGE 1 of 2. This prompt only names candidates. Each candidate is stored as a technology_innovation row with
# status 'candidate' (a thin row: title, category, one-line description, sources). innovation_detail then picks up
# every 'candidate' row, fills the rest and sets status 'active'. The backend must list only status 'active'.
# A candidate that is already on record is given as ref_innovation (its exact title) and is then left as it is.
# A subject placeholder inside a documents query is bound as a SQL parameter, never pasted into the text.

subject:
  key: category_id
  query: |
    SELECT c.category_id, c.category_name, c.category_description
    FROM staging.technology_category c
    WHERE c.is_active
    ORDER BY c.display_order
  documents:
    - from: sql                  # innovations already on record in this category
      query: |
        SELECT 'KNOWN INNOVATION' AS doc, i.title, i.status
        FROM staging.technology_innovation i
        WHERE i.category_id = {{subject.category_id}}
        ORDER BY i.title
    - from: sql                  # recent defence news; the model judges which stories relate to this category (news.category is a news type, not a technology category)
      query: |
        SELECT 'NEWS' AS doc, n.published_date, n.headline, n.publisher, n.article_url
        FROM staging.competitive_news_article n
        WHERE n.published_date >= current_date - 365
          AND COALESCE(n.category, '') NOT IN ('Stock & market', 'Non-defence business')
        ORDER BY n.published_date DESC LIMIT 40

context: [client, competitors]

task: |
  TASK innovation_discovery — list up to 15 recent defence innovations in the category
  "{{subject.category_name}}" ({{subject.category_description}}). Use the DOCUMENTS first, then web
  search.

  An INNOVATION is a new technology, system or capability that a company, research body or
  government has reported as developed, tested, demonstrated, ordered or fielded in the 24 months
  before today. NOT a routine repeat order of an existing product, a market forecast, or a concept
  with no named developer. Each candidate is a distinct innovation (not one system under two
  headlines) supported by at least one allowed source; prefer two, at least one independent or
  official. None found: "records": [] and "skip_reason".

  Per candidate, one record, table technology_innovation:
   - title: a plain name that names the system and its developer, max 100 characters, no adjectives
   - ref_category: {{subject.category_name}}
   - list_description: one or two sentences, max 220 characters: what was reported, by whom, when
   - ref_innovation: the title exactly as in KNOWN INNOVATION if this is that innovation; else null
   children:
   technology_innovation_source (1-3 rows, one per source; the loader finds or creates the source
   by url):
   - source_url, publisher (as shown on the page), source_kind (company = the site of a company in
     this record; official = government, ministry, armed forces, procurement portal, patent
     office; news = news outlet or trade press)
   - is_primary: true for exactly one row (the developer's or government's own statement if there
     is one, else the most detailed independent report)
  Every title and list_description needs _sources (url + the sentence that reports the development).

  CLIENT: {{context.client}}
  COMPETITORS:
  {{context.competitors}}

  DOCUMENTS (innovations on record, then news leads):
  {{documents}}

output:
  technology_innovation:
    card: true
    key: [prompt_id, subject, title]
    refs: {ref_innovation: technology_innovation.title}
    columns:
      title: {required: true, max: 100}
      category_id: {required: true, from_ref: ref_category}
      list_description: {max: 220}
    loader:
      innovation_id: new_id_or_ref_innovation
      pillar_id: technology_pillar_id
      status: constant_candidate
      external_id: category_id_dash_slug_of_title
      created_at: run_time
      updated_at: run_time
    children:
      technology_innovation_source:
        columns: [is_primary]
        required: [is_primary]
        transient: {source_url: {required: true}, publisher: {}, source_kind: {enum: [company, official, news]}}
        loader: {innovation_source_id: new_id, innovation_id: parent_id, source_id: id_of_technology_source_found_or_created_by_url}
        creates:                 # the loader finds-or-creates this row by url; the model never invents an id
          technology_source:
            loader:
              source_id: new_id_if_missing
              url: transient.source_url
              source_url: transient.source_url
              publisher: transient.publisher
              source_kind: transient.source_kind
              label: host_of_url
              retrieved_at: run_time
