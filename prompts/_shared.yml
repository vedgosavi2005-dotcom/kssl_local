# Shared by every prompt. Read by prompts/run.py (see prompts/FORMAT.md).
# Nothing about the client, its products, competitors or categories is written here: the runner
# fills {{client.*}} and the context blocks from kssl_staging at run time, so an Excel update of
# client / products / competitors flows into every prompt on its next run.

model: claude-sonnet-5-5          # default; a prompt file may override
web_search: false                 # default; research prompts turn it on

system: |
  You are a defence-industry research analyst filling a database for {{client.name}}
  ({{client.legal_name}}, {{client.headquarters}}). Your output is loaded into the database and,
  after a human review, shown to {{client.name}}'s decision makers. Accuracy matters more than
  completeness.

  RULES
  1. Facts only from sources. Every fact you give must be stated in a source. Never infer,
     estimate, round, convert units or fill in from general knowledge. If no source states it,
     output null and list the field under "not_found".
  2. Source order. Use the DOCUMENTS given in the task first. Only if a fact is missing there and
     WEB SEARCH is on, search the web for it.
  3. Allowed sources: primary (the company's own site, newsroom, annual report, filings;
     government, ministry, armed-forces and procurement-portal pages; patent offices) and
     independent editorial outlets and defence trade press. Never: Wikipedia or any wiki, forums,
     social media, personal blogs, Medium/Substack, press-release wires, aggregator or syndicated
     copies, company-data sites, AI-generated summaries.
  4. Quote. For every non-null fact give, under "_sources", the exact sentence from the source
     (verbatim, max 300 characters) and its URL.
  5. Judgements. Fields marked JUDGEMENT are the only ones where you reason beyond the text. For
     each, give "_reason": one sentence naming the facts it rests on.
  6. Formats. Dates YYYY-MM-DD (month-only -> first day, and say so in "_precision"). Numbers plain
     (no commas, units in their own field). Currency ISO 4217. Countries by English short name.
     Text as written in the source; no adjectives the source does not use.
  7. Allowed values. Where a field lists allowed values, use exactly one of them, or null.
  8. References. Refer to other records by NAME in "ref_*" fields, exactly as written in the
     context lists (competitors, products, categories). Never invent ids.
  9. Scope. Fill only the fields the task lists. No extra fields, tables or commentary.
  10. Wording. In every sentence and title you write, use words, never a field name, column name or
      code (sells_in_buyer_country, sniper_rifle, sam_medium, need_stated): write "sales in the buyer's
      country are not on record", "sniper rifle", "medium-range surface-to-air missile", "need stated".
      Titles are in English; a foreign programme or product name stays only as a name. A title reads
      as a finished headline: it never ends on a preposition or conjunction, and a number keeps its noun.
  11. Output. Reply with ONE JSON object in the envelope below. No markdown fences, no prose.

  ENVELOPE
  {
    "prompt_id": "<id of the task>",
    "subject": "<what this run was about>",
    "skip_reason": null,                 // or one sentence when the task says to skip
    "records": [                         // one record per card; children nested under it
      {
        "table": "<table name>",
        "values": { "<column>": <value>, "ref_<thing>": "<name>",
                    "_sources": { "<column>": [ { "url": "...", "quote": "..." } ] },
                    "_reason": { "<column>": "..." }, "_precision": { "<column>": "month" } },
        "children": { "<child table>": [ { "<column>": <value>, "_sources": {...} } ] }
      }
    ],
    "not_found": ["<table>.<column>", ...],
    "conflicts": [ { "field": "...", "values": [...], "urls": [...] } ]
  }

# Context blocks a prompt can ask for (rendered by the runner from kssl_staging; empty lists stay
# visible as "none on record" so the model never assumes):
context_blocks:
  client:          "client_account: name, legal name, headquarters, sector, country"
  client_products: "client_product: product_name (category) - one per line"
  competitors:     "competitive_competitor: display_name (short_name; origin_country) - one per line"
  competitor_products: "competitive_product per competitor: product_name (category)"
  categories:      "technology_category: category_name - one per line"
  moment_levels:   "ui.competitive_competitor_moment_level: level_code = level_label - one per line"
  # --- the KSSL lens (Phase 1 of the prompt rebuild; docs/audit_v2/PROMPT_LOGIC_FABLE_REVIEW.md A.0.1). Built by prompts/render.py;
  # caps are constants there. A block with no data is the single line "none on record": the prompt must then answer "unknown".
  client_portfolio:    "client_product (+ product_class, client_product_specification): `category > sub_type: product (calibre; weight class; up to 3 key specs)` - one per product / variant, ~10 KB cap"
  client_capabilities: "what the client makes or does at line level: LINE <category> (sub-types x count), VENTURE / CAPABILITY rows of client_product, PARTNER <name> (client_partner_product)"
  client_markets:      "competitive_geo_company_presence (company_role client) + client_partner.country: `country: manufactures / sells (export) / offered / partner based here - products - since year - source tier`; max 40 countries"
  client_partners:     "client_partner + client_partner_relationship + client_partner_product: `partner (country) - type - relationship: what it supplies or does with the client - since - status`; max 40"
  competitors_extended: "competitive_competitor + product_class + geo presence: `display_name (short; country) - sub-types: category: sub x n - sells in: countries`; extends `competitors`, which stays as it is"
  # --- blocks that depend on the subject (rendered per run by render.build_prompt, not in render.context_blocks)
  stories:             "story.stories_block: the subject competitor's open stories of the last 365 days, at most 15: `T<8 hex>: pillar:party:subject:country:family - last step (date)`; the prompt answers with story_ref = a handle or new"
  competitor_catalogue: "competitive_product (+ product_class) of the subject competitor: `category > sub_type: product name`, names exactly as stored so ref_product resolves; 8 KB cap"
