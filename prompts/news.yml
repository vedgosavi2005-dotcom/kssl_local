id: news
title: Merge duplicate news, categorise, flag what is not about the company
version: 4
fills: [competitive_news_article, competitive_product_news]
shows_on: Profile + Products news lists
cadence: daily
recurring: false                 # a batch (one competitor, one month of new candidates) is decided once
handler: news_merge              # the answer is applied by prompts/news_merge.py, not the generic loader
# model / web_search: inherit from _shared.yml (headlines only, no article text, no web search)

subject:                         # one run per competitor AND calendar month with candidates waiting (staging.news_candidate)
  key: batch_key                 # a new news fetch changes max(found_at) -> a new batch; a decided batch never re-runs
  query: |                       # oldest month first, so a later month sees the stories stored for the earlier ones
    SELECT c.competitor_id::text || '@' || to_char(m.month, 'YYYY-MM') || '@' || to_char(m.found, 'YYYYMMDDHH24MISS') AS batch_key,
           c.competitor_id, c.display_name AS name, m.month, m.new_count
    FROM (SELECT n.competitor_id,
                 date_trunc('month', coalesce(n.published_date, n.found_at::date))::date AS month,
                 max(n.found_at) AS found, count(*) AS new_count
          FROM staging.news_candidate n
          WHERE n.status = 'new'
          GROUP BY 1, 2) m
    JOIN staging.competitive_competitor c ON c.competitor_id = m.competitor_id
    ORDER BY c.display_name, m.month
  documents:
    - from: sql                  # 1st block: the new articles of this month (handles C...)
      query: |
        SELECT 'C' || left(n.candidate_id::text, 8) AS handle,
               CASE WHEN n.product_id IS NULL THEN 'company' ELSE 'product: ' || p.product_name END AS owner,
               CASE WHEN g.status = 'new' THEN 'C' || left(g.candidate_id::text, 8) END AS copy_of,
               n.published_date, n.publisher, n.source_tier,
               CASE n.match_via WHEN 'headline' THEN 'yes' WHEN 'own site' THEN 'own site'
                                WHEN 'page' THEN 'no (page text only)' ELSE 'unknown' END AS named_in_headline,
               n.headline
        FROM staging.news_candidate n
        LEFT JOIN staging.competitive_product p ON p.product_id = n.product_id
        LEFT JOIN staging.news_candidate g ON g.candidate_id = n.pre_group
        WHERE n.status = 'new' AND n.competitor_id = '{{subject.competitor_id}}'::uuid
          AND date_trunc('month', coalesce(n.published_date, n.found_at::date)) = '{{subject.month}}'::date
        ORDER BY owner, n.published_date, n.candidate_id
    - from: sql                  # 2nd block: stories already stored within 21 days of any new article's date (handles S...)
      query: |                   # the batch's own dates, never today's date (same rows as prompts/news_merge.py stored_sql)
        SELECT 'S' || left(a.article_id::text, 8) AS handle, 'company' AS owner,
               a.published_date, a.publisher, a.category, a.headline
        FROM staging.competitive_news_article a
        WHERE a.competitor_id = '{{subject.competitor_id}}'::uuid
          AND EXISTS (SELECT 1 FROM staging.news_candidate c
                      WHERE c.competitor_id = '{{subject.competitor_id}}'::uuid AND c.status = 'new'
                        AND date_trunc('month', coalesce(c.published_date, c.found_at::date)) = '{{subject.month}}'::date
                        AND abs(a.published_date - c.published_date) <= 21)
        UNION ALL
        SELECT 'S' || left(s.product_news_id::text, 8), 'product: ' || p.product_name,
               s.published_date, s.publisher, s.category, s.headline
        FROM staging.competitive_product_news s
        JOIN staging.competitive_product p ON p.product_id = s.product_id
        WHERE p.competitor_id = '{{subject.competitor_id}}'::uuid
          AND EXISTS (SELECT 1 FROM staging.news_candidate c
                      WHERE c.competitor_id = '{{subject.competitor_id}}'::uuid AND c.status = 'new'
                        AND date_trunc('month', coalesce(c.published_date, c.found_at::date)) = '{{subject.month}}'::date
                        AND abs(s.published_date - c.published_date) <= 21)
        ORDER BY owner, published_date

context: [client, competitors]

task: |
  TASK news — for {{subject.name}}: group the news articles found in one month into stories, categorise
  each story, and say whether it is about {{subject.name}}. Several publishers report the same event
  with different headlines; the database keeps ONE row per story. You see headlines only; decide from
  the headlines, publishers and dates.

  DOCUMENTS below hold two blocks of rows. The first block is NEW ARTICLES (handles C...). "owner" is
  "company" or "product: <name>"; "copy_of" names an article the code already knows to be a copy of
  this one; "named_in_headline" is "yes" when the headline names the company (for a product row: the
  product), "own site" for the company's own website, "no (page text only)" when only the page's title or
  description did (the fetch found the company there; on its own that is NOT a reason for relevant =
  "no"), "unknown" when not recorded. The second
  block is STORIES ALREADY STORED for {{subject.name}} dated within 21 days of these articles (handles
  S...; "category" may be empty); "none on record" means there are none.

  RULES
   - Group articles only when they report the SAME event: the same deal, contract, test, launch, visit
     or announcement. A later follow-up event (the order, then its first delivery) is a different story.
     Same topic or same company on the same day is not enough. Different words do not make different
     events: "wins", "selected to build" and "picked for" the same programme are one award, and a visit
     covered by two papers is one visit. Dates 0 to 3 days apart are normal for one event.
   - Compare every new article with the stored stories too. A stored story can be older or newer than
     the article; the same event gets the stored handle in same_as.
   - Group by event, not by owner: one story may hold company articles and articles about one or more of
     the company's products when they report the same event. (The code writes every story to the
     company's news, and also to each product's news that has an article in it.)
   - Articles that share a "copy_of" are already known copies: put them in the same story.
   - Every C handle appears in exactly one story (a story may have a single article). Nothing is
     dropped: every article gets a story and a category.
   - same_as: a list of S handles of already stored stories that report the same event (the event can be
     stored under the company and under a product, so there may be several); [] when it is new.
   - category: exactly one of the eleven below. There is no category for accidents or incidents.
       Contract & order         an order, contract, tender win, selection or procurement decision to supply
                                defence goods or services. If the customer is a foreign government (outside
                                the company's home country), the story is Export, not this.
       Partnership / JV         a defence partnership, MoU, teaming, joint venture, licence or technology tie-up
                                (a civil one is Non-defence business)
       Product launch & testing a product unveiled, tested, trialled or certified
       Delivery & induction     a delivery, handover or induction into service
       Export                   a sale, approval, selection, contract, evaluation or prospective sale with a
                                customer outside the company's home country. Export wins over Contract & order.
       Financial results        reported quarterly/annual results, profit, revenue, order book, guidance,
                                credit ratings
       Stock & market           share-price moves, analyst or broker notes, fund holdings, "breakout" or volume
                                lists, stock tips
       Facility & capacity      a new plant, unit or local subsidiary, expansion, investment, jobs,
                                production capacity
       Leadership & corporate   management changes, strategy statements, restructuring, acquisitions,
                                disposals
       Non-defence business     the company's civil, infrastructure, energy, EPC, real-estate or IT business
                                with no defence angle (metro, power lines, offshore platform, chemical plant,
                                data centre): a civil contract, partnership or MoU is Non-defence business
       Other                    only when none of the above fits: accidents, explosions, fires, safety
                                violations, prosecutions, court cases, regulator actions, labour disputes,
                                general news that names the company. An accident story is always Other.
     Financial results is what the company reported or guided; Stock & market is how the share or the
     market reacts to it. Before choosing Other for an order, delivery, export, plant, result or
     partnership, read the list again. Give a category for every story, also when same_as is set.
   - relevant: "yes" when the story is about {{subject.name}} or one of its products: the company is the
     subject or a main party. "no" only when the headline itself shows that the company is not: it is one
     name in a list (several bidders, several stocks), a "-backed" or "parent of" aside, an evergreen or
     generic page, or the story is about another company (a sister company, a listed company with a
     similar name, a rival, a customer) or about a topic that only mentions it. A headline that does not
     name the company is not enough: a general headline about a sector, a state or a country can still
     be a story about the company's plant or order, so then say "yes". A "no" story is still stored, with
     category Other. When in doubt, say "yes".
   - JUDGEMENT fields (each needs "_reason"): category (one sentence); relevant, only when "no" (one
     sentence: who or what the story is about instead); candidates, only when the story groups 2 or more
     articles (one sentence: why they are the same event).

  OUTPUT: records of table "news_story", one per story. "candidates" is ALWAYS the list of C handles of
  the story, also for a story of a single article (never null or empty); every C handle must be listed:
    {"table": "news_story",
     "values": {"candidates": ["C1a2b3c4d", ...], "same_as": ["S5e6f7a8b"] or [], "category": "...",
                "relevant": "yes" or "no",
                "_reason": {"category": "...", "relevant": "...", "candidates": "..."}}}
  skip_reason only when there are no new articles.

  CLIENT: {{context.client}}
  COMPETITORS:
  {{context.competitors}}

  DOCUMENTS (new articles, then stored stories):
  {{documents}}

output:                          # documentary: news_story is applied by prompts/news_merge.py, not the loader
  news_story:
    columns:
      candidates: {required: true}                 # list of C handles
      same_as: {}                                  # list of S handles, [] when new
      category: {required: true, judgement: true,
                 enum: [Contract & order, Partnership / JV, Product launch & testing, Delivery & induction, Export,
                        Financial results, Stock & market, Facility & capacity, Leadership & corporate,
                        Non-defence business, Other]}
      relevant: {required: true, judgement: true, enum: [yes, no]}   # "no" -> stored with category Other + fact_source column not_about_company
