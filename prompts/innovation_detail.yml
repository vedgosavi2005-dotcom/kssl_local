id: innovation_detail
title: Innovation detail (one candidate innovation)
version: 3
fills: [technology_innovation, technology_innovation_status, technology_innovation_company, technology_innovation_source, technology_innovation_analysis, technology_innovation_milestone, technology_source, technology_company]
shows_on: "Innovation Pipeline (list row badges; detail panel with why it matters, what's new, competitive landscape, background, status block, milestones, sources)"
cadence: quarterly               # STAGE 2 of 2: picks up every technology_innovation row left at status 'candidate' by innovation_discovery
# v3 (step 7; docs/audit_v2/PROMPT_LOGIC_FABLE_REVIEW.md A.3.2): the GATE. Only a real, sourced innovation becomes 'active'. The record
# UPDATES the candidate row (same innovation_id). A candidate the sources show is not an innovation (a product, a routine re-order, no
# named developer, nothing dated) stays at 'candidate' (hidden) with "records": [] and a skip_reason.
#  - maturity_level 1-5 beside the text label; client_position with unknown (a position needs a KSSL product spec row);
#  - stance watch | partner | license | develop | ignore with a reason; derive.innovation_stance allows only what the facts support;
#  - technology_innovation_milestone: a dated timeline announced -> prototype -> trials -> contract -> production -> fielded, each with a source;
#  - documents are the raw layer's stored text of the candidate's sources (a url fetch only when the raw layer has none). No web search.
# A subject placeholder inside a documents query is bound as a SQL parameter, never pasted into the text.

subject:
  key: innovation_id
  query: |
    SELECT i.innovation_id, i.title, i.list_description, i.category_id, c.category_name, i.technology_kind, current_date AS today,
           (SELECT ts.url FROM staging.technology_innovation_source s JOIN staging.technology_source ts ON ts.source_id = s.source_id
             WHERE s.innovation_id = i.innovation_id AND ts.url !~* '^https?://([a-z0-9-]+\.)*(indiandefensenews\.in|thedefensenews\.com|militaryleak\.com|globaldefensecorp\.com|opex360\.com|blogspot\.com|wordpress\.com|medium\.com|substack\.com|idrw\.org|ajaishukla\.com|wikipedia\.org)(/|$)'
             ORDER BY s.is_primary DESC, s.innovation_source_id LIMIT 1 OFFSET 0) AS url_1,
           (SELECT ts.url FROM staging.technology_innovation_source s JOIN staging.technology_source ts ON ts.source_id = s.source_id
             WHERE s.innovation_id = i.innovation_id AND ts.url !~* '^https?://([a-z0-9-]+\.)*(indiandefensenews\.in|thedefensenews\.com|militaryleak\.com|globaldefensecorp\.com|opex360\.com|blogspot\.com|wordpress\.com|medium\.com|substack\.com|idrw\.org|ajaishukla\.com|wikipedia\.org)(/|$)'
             ORDER BY s.is_primary DESC, s.innovation_source_id LIMIT 1 OFFSET 1) AS url_2,
           (SELECT ts.url FROM staging.technology_innovation_source s JOIN staging.technology_source ts ON ts.source_id = s.source_id
             WHERE s.innovation_id = i.innovation_id AND ts.url !~* '^https?://([a-z0-9-]+\.)*(indiandefensenews\.in|thedefensenews\.com|militaryleak\.com|globaldefensecorp\.com|opex360\.com|blogspot\.com|wordpress\.com|medium\.com|substack\.com|idrw\.org|ajaishukla\.com|wikipedia\.org)(/|$)'
             ORDER BY s.is_primary DESC, s.innovation_source_id LIMIT 1 OFFSET 2) AS url_3
    FROM staging.technology_innovation i
    JOIN staging.technology_category c ON c.category_id = i.category_id
    WHERE i.status = 'candidate'
      -- 2026-10-18 credible sources only (subject filter, task unchanged, no version bump): a blog / copy-aggregator source is never
      -- fed to the model, and a candidate resting only on one is not a subject (it stays hidden)
      AND EXISTS (SELECT 1 FROM staging.technology_innovation_source s JOIN staging.technology_source ts ON ts.source_id = s.source_id
                  WHERE s.innovation_id = i.innovation_id AND ts.url !~* '^https?://([a-z0-9-]+\.)*(indiandefensenews\.in|thedefensenews\.com|militaryleak\.com|globaldefensecorp\.com|opex360\.com|blogspot\.com|wordpress\.com|medium\.com|substack\.com|idrw\.org|ajaishukla\.com|wikipedia\.org)(/|$)')
    ORDER BY i.created_at, i.innovation_id
  documents:
    - {from: source_document, field: url_1, min_chars: 400, cap: 9000}
    - {from: source_document, field: url_2, min_chars: 400, cap: 9000}
    - {from: source_document, field: url_3, min_chars: 400, cap: 9000}
    - {from: url, field: url_1}
    - {from: url, field: url_2}
    - {from: url, field: url_3}

context: [client, client_portfolio, client_capabilities, competitors]

task: |
  TASK innovation_detail - build the full record for one candidate innovation: "{{subject.title}}" (category {{subject.category_name}};
  technology kind {{subject.technology_kind}}; found as: {{subject.list_description}}). Today is {{subject.today}}. Use only the DOCUMENTS
  (the candidate's sources). Fields marked JUDGEMENT are your assessment: base them only on cited facts and on the CLIENT PORTFOLIO
  lines, give _reason, and cite in _sources the facts they rest on.

  STEP 1 - THE GATE. It passes only if all hold: (a) the documents report a technology developed, tested, demonstrated, ordered or fielded
  by a NAMED developer; (b) it is a technology, not a product by its own name (a gun, vehicle or drone model) and not a routine repeat order;
  (c) at least one dated development is stated. Otherwise: "records": [] and "skip_reason" = one sentence naming the test that failed.

  STEP 2 - one record, table technology_innovation (updates the candidate row; do NOT output title, category, technology_kind or any field
  not listed here):
   - summary: 1-2 plain sentences, max 300 characters: what it is and who makes it
   - background_what_it_is: 3-5 plain sentences of facts: what the technology is, how it works, stated performance figures with their units,
     who develops it
   - whats_new: 1-3 plain sentences: the latest reported development with its date; null if none is dated
   - competitive_note: JUDGEMENT. 1-3 plain sentences: which other companies the documents name as offering or developing a comparable
     capability, and how they compare on stated figures; null if none is named
   - why_matters_to_kssl: JUDGEMENT. 2-3 plain sentences: how this bears on {{client.name}}'s products. Name the product and the spec from
     CLIENT PORTFOLIO that is touched, e.g. it outranges a product or creates demand for one. If no product is touched, write exactly:
     "No <product> product line is touched; kept because <reason>." No revenue claim. Never write "{{client.name}} should".
   - client_position: JUDGEMENT. behind | parity | ahead | unknown. Other than unknown ONLY when CLIENT PORTFOLIO gives a figure for the same
     spec on a {{client.name}} product AND the documents give a comparable figure for the innovation. behind = the innovation's figure is
     better or no {{client.name}} product offers the capability; parity = comparable; ahead = {{client.name}}'s figure is better. Otherwise unknown.
   - maturity_level: JUDGEMENT, 1-5. The furthest stage the documents REPORT as done: 1 concept or research, 2 prototype built or shown,
     3 trials with a result, 4 production (a production contract or serial production started), 5 fielded (in service or delivered to a user).
   - maturity: a short phrase, max 100 characters, for that stage as the documents describe it, e.g. "Live-fire trials completed"
   - relevance (transient, not stored): JUDGEMENT, 1-5. How directly it touches a {{client.name}} product line: 5 same sub-type and a figure on a
     spec {{client.name}} competes on, 4 same sub-type or an adjacent one with a figure, 3 same category or an enabling technology, 2 adjacent
     category, 1 general.
   - stance: JUDGEMENT. One of watch | partner | license | develop | ignore, with a reason. watch = follow it, nothing to do yet.
     partner / license = {{client.name}} could team on or license it (only when the developer is NOT a competitor). develop = {{client.name}} is
     behind and the technology matters to a product line (needs relevance 4 or 5). ignore = it does not touch the business (relevance 1 or 2).
     The loader checks the rule and falls back to watch when the facts do not support your stance.
   - horizon_year: a single year a document states for service entry, production start or availability; null if none or if it gives a range
   - _reason (one sentence for EVERY judgement above, including competitive_note, why_matters_to_kssl, maturity_level, maturity, relevance and stance,
     each naming the anchor or the portfolio line and the fact it rests on)
   children:
   technology_innovation_status (exactly one row):
   - horizon_text: the year or range exactly as stated (e.g. "2028-2031"); null if not stated. Never estimate; say in _reason which event the
     year is for
   technology_innovation_company (1-4 rows):
   - display_name: the company or government body as the documents name it (do not list {{client.name}})
   - ref_competitor: the COMPETITORS name if it is the same company, else null
   - relationship_type: driver (developer, maker or leading government body; at least one), partner (named co-developer, supplier or teaming
     partner), competitor (named as offering a rival solution)
   - relationship: what this company does in the documents, max 80 characters
   technology_innovation_milestone (2-6 rows, oldest first; only steps the documents date):
   - step_date: the date the documents give (YYYY-MM-DD; month only = the first day)
   - step_type: announced | prototype | trials | contract | production | fielded
   - note: what happened, one plain sentence, max 160 characters
   - source_url: the document url that states it, exactly as in the DOCUMENTS
   - _sources: the verbatim sentence and the url
   technology_innovation_source (the documents used, 1-3 rows; the loader finds or creates each by url):
   - source_url, publisher, source_kind (company | official | news); is_primary true for exactly one
  Do not output technology_innovation_analysis; the loader builds it from the fields above.

  PLAIN ENGLISH. Sentences of 20 words or fewer, one idea each, active voice. Name the company and the thing. Explain a technical term in a few
  words the first time. Numbers keep their unit and date; never convert or round. Never use: leverage, synergy, ecosystem, robust, cutting-edge,
  state-of-the-art, game-changer, going forward, end-to-end, unprecedented. Never write the names of the blocks (CLIENT PORTFOLIO...) in the text.

  CLIENT: {{context.client}}
  CLIENT PORTFOLIO ("category > sub_type: product (calibre; weight class; key specs)"):
  {{context.client_portfolio}}
  CLIENT CAPABILITIES (lines, ventures, capabilities and what partners supply):
  {{context.client_capabilities}}
  COMPETITORS:
  {{context.competitors}}

  DOCUMENTS (the candidate's sources):
  {{documents}}

output:
  technology_innovation:
    card: true
    key: [prompt_id, subject]
    transient:
      relevance: {judgement: true, type: number, enum: [1, 2, 3, 4, 5]}
    columns:
      summary: {max: 300, plain: warn}
      background_what_it_is: {required: true, plain: warn}
      whats_new: {plain: warn}
      competitive_note: {judgement: true, plain: warn}
      why_matters_to_kssl: {judgement: true, plain: strict}
      client_position: {judgement: true, enum_from: code_label.technology_innovation.client_position}
      maturity_level: {required: true, judgement: true, type: number, enum: [1, 2, 3, 4, 5]}
      maturity: {judgement: true, max: 100}
      stance: {required: true, judgement: true, enum_from: code_label.technology_innovation.stance}
      horizon_year: {type: number}
    loader:
      innovation_id: subject.innovation_id       # updates the candidate row
      category_id: subject.category_id
      pillar_id: technology_pillar_id
      title: keep
      status: constant_active
      list_status_label: copy_of_maturity
      list_secondary_value: copy_of_status_horizon_text
      updated_at: run_time
      created_at: keep
    children:
      technology_innovation_status:
        columns: [horizon_text]
        judgement: [horizon_text]
        max: {horizon_text: 80}
        loader:
          status_id: new_id
          maturity_label: copy_of_maturity
          innovation_id: parent_id
          effective_date: run_date
          position_label: {behind: "{{client.name}} behind", parity: "{{client.name}} at parity", ahead: "{{client.name}} ahead"}   # keyed by client_position; unknown / null stays null
          assessment_badge: {behind: GAP, parity: WATCH, ahead: AHEAD}   # keyed by client_position; unknown / null stays null
      technology_innovation_company:
        columns: [display_name, relationship, relationship_type]
        refs: {ref_competitor: competitive_competitor}
        required: [display_name, relationship, relationship_type]
        enum: {relationship_type: [driver, partner, competitor]}
        max: {relationship: 80}
        count: {min: 1, max: 4}
        loader: {innovation_company_id: new_id, innovation_id: parent_id, display_order: index, company_id: id_of_technology_company_found_or_created_by_display_name}
        creates:
          technology_company:
            loader: {company_id: new_id_if_missing, display_name: copy_of_display_name, is_client: false}
      technology_innovation_milestone:
        columns: [step_date, step_type, note, source_url]
        required: [step_date, step_type, note]
        enum_from: {step_type: code_label.technology_innovation_milestone.step_type}
        max: {note: 160}
        count: {min: 1, max: 6, min_action: warn}
        loader: {milestone_id: new_id, innovation_id: parent_id}
      technology_innovation_source:
        columns: [is_primary]
        required: [is_primary]
        transient: {source_url: {required: true}, publisher: {}, source_kind: {enum: [company, official, news]}}
        loader: {innovation_source_id: new_id, innovation_id: parent_id, source_id: id_of_technology_source_found_or_created_by_url}
        creates:
          technology_source:
            loader:
              source_id: new_id_if_missing
              url: transient.source_url
              source_url: transient.source_url
              publisher: transient.publisher
              source_kind: transient.source_kind
              label: host_of_url
              retrieved_at: run_time
      technology_innovation_analysis:
        loader_only: true        # copies of the fixed narrative columns, so the generic section view and the fixed fields never drift
        rows:                    # one row per non-null source column, in this order
          - {section_code: background, section_label: "Background - what it is", narrative: copy_of_background_what_it_is, is_client_assessment: false}
          - {section_code: whats_new, section_label: "What's new", narrative: copy_of_whats_new, is_client_assessment: false}
          - {section_code: competitive, section_label: "Competitive landscape", narrative: copy_of_competitive_note, is_client_assessment: false}
          - {section_code: why_it_matters, section_label: "Why this matters to {{client.name}}", narrative: copy_of_why_matters_to_kssl, is_client_assessment: true}
        loader: {analysis_id: new_id, innovation_id: parent_id, display_order: index}

derive: [innovation_stance]
