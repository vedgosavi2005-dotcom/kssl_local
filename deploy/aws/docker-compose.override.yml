# AWS live server only (EC2): the live site, its API and the serving database, with Caddy in front for automatic HTTPS
# (Let's Encrypt). The review site and Approve stay on VPS1; the data arrives from VPS1 (deploy/aws/push_live.sh).
# deploy/aws/bootstrap.sh links this file as deploy/docker-compose.override.yml, so the usual `docker compose up -d`
# (deploy/deploy_vps.sh) picks it up. Needs LIVE_HOST in deploy/.env. The traefik labels in docker-compose.yml are unused here.
services:
  api-review: {profiles: [review]}      # not started on AWS: a profile nobody enables
  web-review: {profiles: [review]}
  caddy:
    image: caddy:2.8.4
    container_name: kssl2-caddy
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      LIVE_HOST: ${LIVE_HOST}
    volumes:
      - ./aws/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificates: kept across restarts so Let's Encrypt is not asked again
      - caddy_config:/config
    depends_on: [web]

volumes:
  caddy_data:
  caddy_config:
